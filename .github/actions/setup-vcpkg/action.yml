name: Setup vcpkg
description: Clones, bootstraps, and installs vcpkg packages with caching
inputs:
  triplet:
    description: vcpkg triplet to use
    required: true
  commit:
    description: vcpkg commit hash to use
    required: true
  overlay-triplets:
    description: Path to overlay triplets
    default: vcpkg-triplets

runs:
  using: composite
  steps:
    - name: Restore vcpkg packages
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: vcpkg_installed
        key: >-
          ${{
            format(
              'vcpkg-{0}-{1}-{2}',
              inputs.triplet,
              inputs.commit,
              hashFiles('vcpkg.json', format('{0}/{1}.cmake', inputs.overlay-triplets, inputs.triplet))
            )
          }}

    - name: Install vcpkg (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        git -C vcpkg -c advice.detachedHead=false checkout --quiet "${{ inputs.commit }}"
        vcpkg/bootstrap-vcpkg.sh
        echo "VCPKG_ROOT=$PWD/vcpkg" >> $GITHUB_ENV
        echo "$PWD/vcpkg" >> $GITHUB_PATH

    - name: Install vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        git -C vcpkg -c advice.detachedHead=false checkout --quiet "${{ inputs.commit }}"
        .\vcpkg\bootstrap-vcpkg.bat
        "$PWD\vcpkg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "VCPKG_ROOT=$PWD\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: brew install nasm

    - name: Install vcpkg packages
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        vcpkg install \
          --triplet ${{ inputs.triplet }} \
          --overlay-triplets=${{ inputs.overlay-triplets }} \
          --x-install-root=vcpkg_installed
      env:
        VCPKG_FORCE_SYSTEM_BINARIES: 1

    - name: Save vcpkg packages
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: vcpkg_installed
        key: >-
          ${{
            format(
              'vcpkg-{0}-{1}-{2}',
              inputs.triplet,
              inputs.commit,
              hashFiles('vcpkg.json', format('{0}/{1}.cmake', inputs.overlay-triplets, inputs.triplet))
            )
          }}
