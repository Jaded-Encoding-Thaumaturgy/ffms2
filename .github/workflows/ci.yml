name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    uses: ./.github/workflows/ci-build-windows.yml

  build-linux:
    uses: ./.github/workflows/ci-build-linux.yml

  build-macos:
    uses: ./.github/workflows/ci-build-macos.yml

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: "3.12"

      - name: Build wheel
        run: uv build --sdist --config-setting=setup-args=-Dsdist=true

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.gz

  publish:
    name: Publish to vs-wheels
    needs:
      - build-windows
      - build-linux
      - build-macos
      - build-sdist
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Determine version
        id: version
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          VERSION=$(basename "$WHEEL" | sed 's/^[^-]*-\([^-]*\)-.*/\1/')
          TAG="vapoursynth-ffms2-v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"
          echo "Release tag: $TAG"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          repository: Jaded-Encoding-Thaumaturgy/vs-wheels
          token: ${{ secrets.VS_WHEELS_RELEASE_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: vapoursynth-ffms2 ${{ steps.version.outputs.version }}
          files: dist/*
          body: vapoursynth-ffms2 ${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          generate_release_notes: false

  trigger-index:
    name: Trigger vs-wheels index
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.VS_WHEELS_RELEASE_TOKEN }}
          repository: Jaded-Encoding-Thaumaturgy/vs-wheels
          event-type: index
