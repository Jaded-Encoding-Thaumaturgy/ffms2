name: Build macOS Wheel

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x86_64
            os: macos-26-intel
            vcpkg_triplet: x64-osx-release
          - name: macOS arm64
            os: macos-26
            vcpkg_triplet: arm64-osx-release

    name: Build wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: "3.12"

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: ${{ matrix.vcpkg_triplet }}
          commit: "d015e31e90838a4c9dfa3eed45979bc70d9357fc" # renovate: datasource=github-tags depName=microsoft/vcpkg currentValue=2026.05.25 versioning=loose

      - name: Build wheels
        uses: pypa/cibuildwheel@294735312765b09d24a2fbec22660ce817587d55 # v4.1
        env:
          CIBW_BUILD: cp312-*
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_ENVIRONMENT: >
            PKG_CONFIG_PATH="${{ github.workspace }}/vcpkg_installed/${{ matrix.vcpkg_triplet }}/lib/pkgconfig"
            MACOSX_DEPLOYMENT_TARGET=13

      - name: Repair wheel tags
        run: uvx wheel tags --python-tag py3 --abi-tag none wheelhouse/*.whl --remove

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-${{ matrix.name }}
          path: ./wheelhouse/*.whl
