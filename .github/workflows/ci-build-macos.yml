name: Build macOS Wheel

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x86_64
            os: macos-26-intel
            vcpkg_triplet: x64-osx-release
          - name: macOS arm64
            os: macos-26
            vcpkg_triplet: arm64-osx-release

    name: Build wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: ${{ matrix.vcpkg_triplet }}
          commit: "9e593bb18ea69cc5095e012465dcd675a822ed0d" # renovate: datasource=github-tags depName=microsoft/vcpkg currentValue=2026.07.29 versioning=loose

      - name: Build wheels
        uses: pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c # v4.1
        env:
          CIBW_BUILD: cp312-*
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_ENVIRONMENT: >
            PKG_CONFIG_PATH="${{ github.workspace }}/vcpkg_installed/${{ matrix.vcpkg_triplet }}/lib/pkgconfig"
            MACOSX_DEPLOYMENT_TARGET=13

      - name: Repair wheel tags
        run: uvx wheel tags --python-tag py3 --abi-tag none wheelhouse/*.whl --remove

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-${{ matrix.name }}
          path: ./wheelhouse/*.whl
