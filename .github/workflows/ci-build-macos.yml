name: Build macOS Wheel

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x86_64
            os: macos-26-intel
            vcpkg_triplet: x64-osx-release
          - name: macOS arm64
            os: macos-26
            vcpkg_triplet: arm64-osx-release

    name: Build wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: ${{ matrix.vcpkg_triplet }}
          commit: "ddd0023b0eee70986e42ed49d9d4afb8098f212e" # renovate: datasource=github-tags depName=microsoft/vcpkg currentValue=ddd0023b0eee70986e42ed49d9d4afb8098f212e versioning=loose

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2
        env:
          CIBW_BUILD: cp312-*
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_ENVIRONMENT: >
            PKG_CONFIG_PATH="${{ github.workspace }}/vcpkg_installed/${{ matrix.vcpkg_triplet }}/lib/pkgconfig"
            MACOSX_DEPLOYMENT_TARGET=13

      - name: Repair wheel tags
        run: uvx wheel tags --python-tag py3 --abi-tag none wheelhouse/*.whl --remove

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-${{ matrix.name }}
          path: ./wheelhouse/*.whl
