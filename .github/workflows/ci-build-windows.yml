name: Build Windows Wheel

on:
  workflow_call:
  workflow_dispatch:

env:
  VCPKG_TRIPLET: x64-windows-static-release

jobs:
  build-wheel:
    name: Build wheel Windows x64
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: ${{ env.VCPKG_TRIPLET }}
          commit: "d015e31e90838a4c9dfa3eed45979bc70d9357fc" # renovate: datasource=github-tags depName=microsoft/vcpkg currentValue=2026.05.25 versioning=loose

      - name: Configure pkg-config
        shell: pwsh
        run: |
          # Expose pkgconf as pkg-config on PATH
          $toolsDir = "${{ github.workspace }}\vcpkg_installed\${{ env.VCPKG_TRIPLET }}\tools\pkgconf"
          if (Test-Path "$toolsDir\pkgconf.exe") {
            if (-not (Test-Path "$toolsDir\pkg-config.exe")) {
              Copy-Item "$toolsDir\pkgconf.exe" "$toolsDir\pkg-config.exe" -Force
            }
          }
          "$toolsDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ github.workspace }}\vcpkg_installed\${{ env.VCPKG_TRIPLET }}"
          $env:LIB = "$vcpkgRoot\lib;$env:LIB"
          $env:INCLUDE = "$vcpkgRoot\include;$env:INCLUDE"
          $env:PKG_CONFIG_PATH = "$vcpkgRoot\lib\pkgconfig"
          uv build --wheel -C setup-args=--vsenv -C setup-args="-Db_vscrt=mt"

      - name: Repair wheel tags
        shell: bash
        run: uvx wheel tags --python-tag py3 --abi-tag none dist/*.whl --remove

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-Windows-x64
          path: dist/*
