name: Build Windows Wheel

on:
  workflow_call:
  workflow_dispatch:

env:
  VCPKG_INSTALLATION_ROOT: C:\vcpkg
  VCPKG_TRIPLET: x64-windows-static-release

jobs:
  build-wheel:
    name: Build wheel Windows x64
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"

      - name: Restore vcpkg packages
        id: cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: vcpkg_installed
          key: >-
            ${{
              format(
                'vcpkg-{0}-{1}',
                env.VCPKG_TRIPLET,
                hashFiles('vcpkg.json', format('vcpkg-triplets/{0}.cmake', env.VCPKG_TRIPLET))
              )
            }}

      - name: Install vcpkg packages
        shell: pwsh
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          vcpkg install `
            --triplet ${{ env.VCPKG_TRIPLET }} `
            --overlay-triplets=vcpkg-triplets `
            --x-install-root=vcpkg_installed
        env:
          VCPKG_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT }}

      - name: Set up vcpkg
        shell: pwsh
        run: |
          # Expose pkgconf as pkg-config on PATH
          $toolsDir = "${{ github.workspace }}\vcpkg_installed\${{ env.VCPKG_TRIPLET }}\tools\pkgconf"
          if (Test-Path "$toolsDir\pkgconf.exe") {
            if (-not (Test-Path "$toolsDir\pkg-config.exe")) {
              Copy-Item "$toolsDir\pkgconf.exe" "$toolsDir\pkg-config.exe" -Force
            }
          }
          "$toolsDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Save vcpkg packages
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: vcpkg_installed
          key: >-
            ${{
              format(
                'vcpkg-{0}-{1}',
                env.VCPKG_TRIPLET,
                hashFiles('vcpkg.json', format('vcpkg-triplets/{0}.cmake', env.VCPKG_TRIPLET))
              )
            }}

      - name: Build
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ github.workspace }}\vcpkg_installed\${{ env.VCPKG_TRIPLET }}"
          $env:LIB = "$vcpkgRoot\lib;$env:LIB"
          $env:INCLUDE = "$vcpkgRoot\include;$env:INCLUDE"
          $env:PKG_CONFIG_PATH = "$vcpkgRoot\lib\pkgconfig"
          uv build --wheel -C setup-args=--vsenv -C setup-args="-Db_vscrt=mt"

      - name: Repair wheel tags
        shell: bash
        run: uvx wheel tags --python-tag py3 --abi-tag none dist/*.whl --remove

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
