name: Build Windows Wheel

on:
  workflow_call:
  workflow_dispatch:

env:
  VCPKG_TRIPLET: x64-windows-static-release

jobs:
  build-wheel:
    name: Build wheel Windows x64
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          python-version: "3.12"

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: ${{ env.VCPKG_TRIPLET }}
          commit: "cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3" # renovate: datasource=github-tags depName=microsoft/vcpkg currentValue=2026.06.24 versioning=loose

      - name: Configure pkg-config
        shell: pwsh
        run: |
          # Expose pkgconf as pkg-config on PATH
          $toolsDir = "${{ github.workspace }}\vcpkg_installed\${{ env.VCPKG_TRIPLET }}\tools\pkgconf"
          if (Test-Path "$toolsDir\pkgconf.exe") {
            if (-not (Test-Path "$toolsDir\pkg-config.exe")) {
              Copy-Item "$toolsDir\pkgconf.exe" "$toolsDir\pkg-config.exe" -Force
            }
          }
          "$toolsDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ github.workspace }}\vcpkg_installed\${{ env.VCPKG_TRIPLET }}"
          $env:LIB = "$vcpkgRoot\lib;$env:LIB"
          $env:INCLUDE = "$vcpkgRoot\include;$env:INCLUDE"
          $env:PKG_CONFIG_PATH = "$vcpkgRoot\lib\pkgconfig"
          $nativeFile = Join-Path $env:GITHUB_WORKSPACE 'clang-cl.ini'
          uv build --wheel -C setup-args=--vsenv -C "setup-args=--native-file=$nativeFile" -C setup-args="-Db_vscrt=mt"

      - name: Repair wheel tags
        shell: bash
        run: uvx wheel tags --python-tag py3 --abi-tag none dist/*.whl --remove

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-Windows-x64
          path: dist/*
